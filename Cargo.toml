[package]
name = "ditador"
version = "0.5.0"
edition = "2024"
description = "Ditado por voz offline (speech-to-text) com Whisper, para Ubuntu/GNOME"
license = "MIT"
repository = "https://github.com/DanielFreitasDev/ditador"
# Este é um aplicativo, não uma biblioteca: nada aqui vai para o crates.io.
publish = false

# A régua de qualidade do projeto escrita onde o compilador lê, e não só em
# prosa no CLAUDE.md. O código já passava nas duas antes de elas existirem.
[lints.clippy]
all = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[features]
# Vulkan é o padrão: usa a GPU NVIDIA/AMD/Intel sem precisar do CUDA Toolkit.
#
# Ativamos o backend direto no whisper-rs-sys em vez de usar `whisper-rs/vulkan`.
# Motivo: o módulo auxiliar `vulkan` do whisper-rs 0.16 (só lista dispositivos,
# que não usamos) referencia símbolos ausentes do bindings.rs pré-gerado do crate
# -sys, e regenerar aquele arquivo exigiria instalar o LLVM/libclang inteiro.
# Pelo caminho de baixo o whisper.cpp é compilado e ligado com Vulkan do mesmo
# jeito — o ggml registra o backend sozinho em tempo de execução.
default = ["vulkan"]
vulkan = ["whisper-rs-sys/vulkan"]
# Requer o CUDA Toolkit instalado (nvcc). Compile com: cargo build --release --no-default-features --features cuda
cuda = ["whisper-rs-sys/cuda"]
# Só CPU, sem nenhuma dependência de GPU: cargo build --release --no-default-features --features cpu
cpu = []

[dependencies]
anyhow = "1"
arboard = "3"
cpal = "0.18"
crossbeam-channel = "0.5"
dirs = "6"
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
env_logger = "0.11"
evdev = "0.13"
# Só PNG: os ícones embutidos e as capturas de diagnóstico (DITADOR_CAPTURA).
image = { version = "0.25.10", default-features = false, features = ["png"] }
# `blocking` é só a fachada síncrona; o ksni ainda exige um executor por
# baixo. async-io (smol) é bem mais leve que o tokio, que é o padrão.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = { version = "0.16", default-features = false, features = ["log_backend"] }
# Dependência direta apenas para poder ligar o backend de GPU no crate -sys
# (veja o comentário em [features]). O código só usa a API do whisper-rs.
whisper-rs-sys = { version = "0.15", default-features = false }
# A interface D-Bus que a extensão do GNOME Shell consome (`src/dbus.rs`).
#
# Não custa nada em tamanho: o ksni já fala com a barra superior pelo zbus, na
# mesma versão e com as mesmas features (`async-io` + `blocking-api`, que são o
# padrão). Declará-lo aqui não acrescentou uma linha de crate ao Cargo.lock — só
# a aresta de dependência. Trazer uma segunda biblioteca de D-Bus para o
# projeto, além de maior, faria dois executores conviverem no mesmo processo.
zbus = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
