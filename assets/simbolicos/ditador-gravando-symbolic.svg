<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>Ditador — gravando</title>
  <!-- Ponto de gravação com anel: à distância de um relance na barra superior,
       a silhueta redonda separa "ouvindo" de "parado" melhor que o microfone.
       Cada círculo é feito de dois meios-arcos — um arco de volta inteira tem
       início e fim no mesmo ponto, e aí o desenho degenera. -->
  <g fill="#2e3436" fill-rule="evenodd">
    <path d="M8,1.4 A6.6,6.6 0 0 1 8,14.6 A6.6,6.6 0 0 1 8,1.4 Z
             M8,2.8 A5.2,5.2 0 0 0 8,13.2 A5.2,5.2 0 0 0 8,2.8 Z"/>
    <circle cx="8" cy="8" r="3.2"/>
  </g>
</svg>
