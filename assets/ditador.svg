<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Ditador</title>
  <!--
    Cores sólidas, quatro formas, nenhum degradê: a pastilha quase preta e o
    microfone branco. Nada aqui depende de desfoque, transparência ou brilho,
    então o ícone sai igual em qualquer tamanho e sobre qualquer área de
    trabalho.

    A silhueta é um squircle (superelipse |x/r|^5 + |y/r|^5 = 1), traçado como
    polilinha porque a superelipse não tem forma exata em Bézier: com 22 pontos
    por canto o desvio fica abaixo de um décimo de pixel mesmo a 1024 px. O
    microfone é o mesmo do ícone da barra superior, nas mesmas proporções:
    cápsula, berço e pé.
  -->
  <path d="M488.00,256.00 L487.76,336.69 L487.05,362.36 L485.86,380.88 L484.19,395.77 L482.03,408.35 L479.37,419.26 L476.20,428.87 L472.50,437.41 L468.25,445.03 L463.41,451.86 L457.97,457.97 L451.86,463.41 L445.03,468.25 L437.41,472.50 L428.87,476.20 L419.26,479.37 L408.35,482.03 L395.77,484.19 L380.88,485.86 L362.36,487.05 L336.69,487.76 L256.00,488.00 L24.00,256.00 L24.24,336.69 L24.95,362.36 L26.14,380.88 L27.81,395.77 L29.97,408.35 L32.63,419.26 L35.80,428.87 L39.50,437.41 L43.75,445.03 L48.59,451.86 L54.03,457.97 L60.14,463.41 L66.97,468.25 L74.59,472.50 L83.13,476.20 L92.74,479.37 L103.65,482.03 L116.23,484.19 L131.12,485.86 L149.64,487.05 L175.31,487.76 L256.00,488.00 L24.00,256.00 L24.24,175.31 L24.95,149.64 L26.14,131.12 L27.81,116.23 L29.97,103.65 L32.63,92.74 L35.80,83.13 L39.50,74.59 L43.75,66.97 L48.59,60.14 L54.03,54.03 L60.14,48.59 L66.97,43.75 L74.59,39.50 L83.13,35.80 L92.74,32.63 L103.65,29.97 L116.23,27.81 L131.12,26.14 L149.64,24.95 L175.31,24.24 L256.00,24.00 L488.00,256.00 L487.76,175.31 L487.05,149.64 L485.86,131.12 L484.19,116.23 L482.03,103.65 L479.37,92.74 L476.20,83.13 L472.50,74.59 L468.25,66.97 L463.41,60.14 L457.97,54.03 L451.86,48.59 L445.03,43.75 L437.41,39.50 L428.87,35.80 L419.26,32.63 L408.35,29.97 L395.77,27.81 L380.88,26.14 L362.36,24.95 L336.69,24.24 L256.00,24.00 Z" fill="#171717"/>
  <g fill="#FFFFFF">
    <!-- Cápsula. -->
    <rect x="198" y="103" width="116" height="190" rx="58"/>
    <!-- Berço: uma faixa, e não um traço, para o desenho não depender de
         espessura de linha ao ser reduzido a 16 px. -->
    <path d="M362,252 A106,106 0 0 1 150,252 L174,252 A82,82 0 0 0 338,252 Z"/>
    <!-- Pé. -->
    <rect x="245" y="358" width="22" height="54" rx="11"/>
  </g>
</svg>
